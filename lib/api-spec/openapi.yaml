openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TravelHub API - Comprehensive travel management platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trips
    description: Trip management
  - name: flights
    description: Air logistics
  - name: parking
    description: Airport parking
  - name: rentals
    description: Vehicle rentals
  - name: accommodations
    description: Accommodations
  - name: itinerary
    description: Day-by-day itinerary
  - name: documents
    description: Document vault

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List all trips
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a new trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip by ID
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Update a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
    delete:
      operationId: deleteTrip
      tags: [trips]
      summary: Delete a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/share:
    post:
      operationId: generateShareLink
      tags: [trips]
      summary: Generate or retrieve a shareable read-only link token for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "404":
          description: Trip not found

  /shared/{token}:
    get:
      operationId: getSharedTrip
      tags: [trips]
      summary: Get full read-only trip snapshot by share token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared trip snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTrip"
        "404":
          description: Not found

  /trips/{tripId}/progress:
    get:
      operationId: getTripProgress
      tags: [trips]
      summary: Get document upload progress for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripProgress"

  /trips/{tripId}/flights:
    get:
      operationId: listFlights
      tags: [flights]
      summary: List flights for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"
    post:
      operationId: createFlight
      tags: [flights]
      summary: Add a flight to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightInput"
      responses:
        "201":
          description: Created flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"

  /trips/{tripId}/flights/{flightId}:
    patch:
      operationId: updateFlight
      tags: [flights]
      summary: Update a flight
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: flightId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightUpdate"
      responses:
        "200":
          description: Updated flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
    delete:
      operationId: deleteFlight
      tags: [flights]
      summary: Delete a flight
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: flightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/parking:
    get:
      operationId: listParkings
      tags: [parking]
      summary: List parking reservations for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of parking reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parking"
    post:
      operationId: createParking
      tags: [parking]
      summary: Add a parking reservation to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingInput"
      responses:
        "201":
          description: Created parking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parking"

  /trips/{tripId}/parking/{parkingId}:
    patch:
      operationId: updateParking
      tags: [parking]
      summary: Update a parking reservation
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: parkingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingUpdate"
      responses:
        "200":
          description: Updated parking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parking"
    delete:
      operationId: deleteParking
      tags: [parking]
      summary: Delete a parking reservation
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: parkingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/rentals:
    get:
      operationId: listRentals
      tags: [rentals]
      summary: List vehicle rentals for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of vehicle rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
    post:
      operationId: createRental
      tags: [rentals]
      summary: Add a vehicle rental to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalInput"
      responses:
        "201":
          description: Created rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /trips/{tripId}/rentals/{rentalId}:
    patch:
      operationId: updateRental
      tags: [rentals]
      summary: Update a vehicle rental
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: rentalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalUpdate"
      responses:
        "200":
          description: Updated rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
    delete:
      operationId: deleteRental
      tags: [rentals]
      summary: Delete a vehicle rental
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: rentalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/accommodations:
    get:
      operationId: listAccommodations
      tags: [accommodations]
      summary: List accommodations for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of accommodations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"
    post:
      operationId: createAccommodation
      tags: [accommodations]
      summary: Add an accommodation to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccommodationInput"
      responses:
        "201":
          description: Created accommodation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"

  /trips/{tripId}/accommodations/{accommodationId}:
    patch:
      operationId: updateAccommodation
      tags: [accommodations]
      summary: Update an accommodation
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: accommodationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccommodationUpdate"
      responses:
        "200":
          description: Updated accommodation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
    delete:
      operationId: deleteAccommodation
      tags: [accommodations]
      summary: Delete an accommodation
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: accommodationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/itinerary:
    get:
      operationId: listItineraryItems
      tags: [itinerary]
      summary: List itinerary items for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of itinerary items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItineraryItem"
    post:
      operationId: createItineraryItem
      tags: [itinerary]
      summary: Add an itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryItemInput"
      responses:
        "201":
          description: Created itinerary item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItem"

  /trips/{tripId}/itinerary/{itemId}:
    patch:
      operationId: updateItineraryItem
      tags: [itinerary]
      summary: Update an itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryItemUpdate"
      responses:
        "200":
          description: Updated itinerary item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItem"
    delete:
      operationId: deleteItineraryItem
      tags: [itinerary]
      summary: Delete an itinerary item
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trips/{tripId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload a document for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /trips/{tripId}/documents/{documentId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Trip:
      type: object
      required: [id, name, destination, startDate, endDate, status, coverImage, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [upcoming, ongoing, completed]
        coverImage:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        shareToken:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TripInput:
      type: object
      required: [name, destination, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
        destination:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        coverImage:
          type: string
        notes:
          type: string

    TripUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        coverImage:
          type: string
        status:
          type: string
          enum: [upcoming, ongoing, completed]
        notes:
          type: string

    TripProgress:
      type: object
      required: [tripId, totalModules, completedModules, percentComplete, moduleBreakdown]
      properties:
        tripId:
          type: integer
        totalModules:
          type: integer
        completedModules:
          type: integer
        percentComplete:
          type: integer
        moduleBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ModuleProgress"

    ModuleProgress:
      type: object
      required: [module, label, hasDocuments, documentCount]
      properties:
        module:
          type: string
        label:
          type: string
        hasDocuments:
          type: boolean
        documentCount:
          type: integer

    Flight:
      type: object
      required: [id, tripId, airline, flightNumber, departureAirport, arrivalAirport, departureTime, arrivalTime, terminal, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        airline:
          type: string
        flightNumber:
          type: string
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        terminal:
          type: ["string", "null"]
        gate:
          type: ["string", "null"]
        seat:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    FlightInput:
      type: object
      required: [airline, flightNumber, departureAirport, arrivalAirport, departureTime, arrivalTime]
      properties:
        airline:
          type: string
          minLength: 1
        flightNumber:
          type: string
          minLength: 1
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        terminal:
          type: string
        gate:
          type: string
        seat:
          type: string
        notes:
          type: string

    FlightUpdate:
      type: object
      properties:
        airline:
          type: string
        flightNumber:
          type: string
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        terminal:
          type: string
        gate:
          type: string
        seat:
          type: string
        notes:
          type: string

    Parking:
      type: object
      required: [id, tripId, location, reservationCode, entryDate, exitDate, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        location:
          type: string
        reservationCode:
          type: string
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
        priceTotal:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ParkingInput:
      type: object
      required: [location, reservationCode, entryDate, exitDate]
      properties:
        location:
          type: string
          minLength: 1
        reservationCode:
          type: string
          minLength: 1
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
        priceTotal:
          type: number
        notes:
          type: string

    ParkingUpdate:
      type: object
      properties:
        location:
          type: string
        reservationCode:
          type: string
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
        priceTotal:
          type: number
        notes:
          type: string

    Rental:
      type: object
      required: [id, tripId, company, pickupLocation, pickupDate, returnDate, fuelPolicy, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        company:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: ["string", "null"]
        pickupDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        fuelPolicy:
          type: string
        vehicleType:
          type: ["string", "null"]
        confirmationCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RentalInput:
      type: object
      required: [company, pickupLocation, pickupDate, returnDate, fuelPolicy]
      properties:
        company:
          type: string
          minLength: 1
        pickupLocation:
          type: string
          minLength: 1
        returnLocation:
          type: string
        pickupDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        fuelPolicy:
          type: string
        vehicleType:
          type: string
        confirmationCode:
          type: string
        notes:
          type: string

    RentalUpdate:
      type: object
      properties:
        company:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        pickupDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        fuelPolicy:
          type: string
        vehicleType:
          type: string
        confirmationCode:
          type: string
        notes:
          type: string

    Accommodation:
      type: object
      required: [id, tripId, name, address, checkIn, checkOut, confirmationCode, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [hotel, airbnb, hostel, other]
        address:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        confirmationCode:
          type: string
        contactPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AccommodationInput:
      type: object
      required: [name, address, checkIn, checkOut, confirmationCode]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [hotel, airbnb, hostel, other]
        address:
          type: string
          minLength: 1
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        confirmationCode:
          type: string
        contactPhone:
          type: string
        notes:
          type: string

    AccommodationUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [hotel, airbnb, hostel, other]
        address:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        confirmationCode:
          type: string
        contactPhone:
          type: string
        notes:
          type: string

    ItineraryItem:
      type: object
      required: [id, tripId, date, time, title, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        date:
          type: string
          format: date
        time:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        category:
          type: string
          enum: [transport, sightseeing, dining, activity, accommodation, other]
        createdAt:
          type: string
          format: date-time

    ItineraryItemInput:
      type: object
      required: [date, title]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
