kind = "web"
previewPath = "/"
title = "TravelHub"
version = "1.0.0"
id = "artifacts/travel-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22462

[services.development]
run = "pnpm --filter @workspace/travel-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-hub", "run", "build" ]
publicDir = "artifacts/travel-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22462"
BASE_PATH = "/"
