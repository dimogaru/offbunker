<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TravelHub</title>
    <meta name="description" content="Gestiona tus viajes sin conexión a internet. Vuelos, hoteles, itinerarios y documentos siempre disponibles." />
    <meta name="robots" content="index, follow" />

    <!-- PWA meta tags -->
    <meta name="theme-color" content="#0f4a52" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TravelHub" />

    <!-- OG -->
    <meta property="og:title" content="TravelHub" />
    <meta property="og:description" content="Gestiona tus viajes sin conexión a internet." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelHub" />
    <meta name="twitter:description" content="Gestiona tus viajes sin conexión a internet." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
